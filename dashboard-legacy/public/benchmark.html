<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trading bench — Benchmark</title>
  <link rel="stylesheet" href="/dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
</head>
<body data-page="benchmark">
  <div class="shell">
    <header class="top">
      <div class="brand"><h1>Trading Hub</h1></div>
      <div class="toolbar">
        <button type="button" class="btn" id="btnRefresh">↻ Refresh</button>
        <button type="button" class="btn" id="btnTheme">◐ Theme</button>
      </div>
      <div class="status-row" id="statusPills"></div>
      <p id="pageErr" class="err" style="display:none;width:100%;flex-basis:100%;margin-top:.5rem;"></p>
    </header>

    <div class="layout">
      <nav class="site-nav" aria-label="Main">
        <div class="nav-section">
          <div class="nav-label">Monitor</div>
          <a href="/">Overview</a>
          <a href="/positions">Positions</a>
        </div>
        <div class="nav-section">
          <div class="nav-label">Analyze</div>
          <a href="/benchmark">Benchmark</a>
          <a href="/watchlist">Watchlist ML</a>
          <a href="/model">Model</a>
        </div>
        <div class="nav-section">
          <div class="nav-label">Control</div>
          <a href="/scheduler">Scheduler</a>
        </div>
        <div class="nav-spacer"></div>
        <div class="schedule-widget">
          <div class="nav-label">Scheduler</div>
          <div class="sw-countdown" id="swCountdown">--:--:--</div>
          <div class="sw-countdown-label" id="swCountdownLabel">until next run</div>
          <div class="sw-toggle-row">
            <span>Auto-run</span>
            <label class="toggle-switch">
              <input type="checkbox" id="swAutoRun">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="sw-status-row">
            <span class="sw-dot idle" id="swDot"></span>
            <span class="sw-status-text" id="swStatus">Idle</span>
          </div>
        </div>
      </nav>

      <main class="content">
        <div class="page-header">
          <div class="page-breadcrumb">// Analyze · Benchmark</div>
          <h1 class="page-title">Portfolio vs SPY</h1>
        </div>
        <section class="panel" id="benchmark">
          <h2>Summary</h2>
          <div class="kpis" id="kpiRow">
            <div class="kpi skeleton"><span>—</span><strong>—</strong></div>
            <div class="kpi skeleton"><span>—</span><strong>—</strong></div>
            <div class="kpi skeleton"><span>—</span><strong>—</strong></div>
            <div class="kpi skeleton"><span>—</span><strong>—</strong></div>
          </div>
          <div class="chart-wrap"><canvas id="chart" aria-label="Portfolio vs SPY chart"></canvas></div>
          <p id="chartNote" class="note"></p>
          <h2 style="margin-top:1rem">Run log</h2>
          <div class="table-scroll">
            <table class="data" id="statsTable" aria-label="Historical stats"><thead></thead><tbody></tbody></table>
          </div>
        </section>
        <footer class="foot">
          <span id="footMeta"></span> · Auto-refresh every 60s, or click Refresh.
        </footer>
      </main>
    </div>
  </div>
  <script src="/dashboard.js"></script>
</body>
</html>
