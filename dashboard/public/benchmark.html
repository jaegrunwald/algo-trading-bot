<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trading bench — Benchmark</title>
  <link rel="stylesheet" href="/dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
</head>
<body data-page="benchmark">
  <div class="shell">
    <header class="top">
      <div class="brand">
        <h1>Benchmark</h1>
        <p>Portfolio vs SPY buy-and-hold from <code>portfolio_stats.csv</code>.</p>
      </div>
      <div class="toolbar">
        <button type="button" class="btn" id="btnRefresh" title="Reload">↻ Refresh</button>
        <button type="button" class="btn" id="btnTheme" title="Toggle theme">◐ Theme</button>
      </div>
      <div class="status-row" id="statusPills"></div>
      <p id="pageErr" class="err" style="display: none; width: 100%; flex-basis: 100%; margin-top: 0.5rem;"></p>
    </header>

    <nav class="site-nav" aria-label="Main">
      <a href="/">Home</a>
      <a href="/benchmark">Benchmark</a>
      <a href="/watchlist">Watchlist ML</a>
      <a href="/model">Model</a>
      <a href="/positions">Positions</a>
    </nav>

    <section class="panel" id="benchmark">
      <h2>Summary</h2>
      <div class="kpis" id="kpiRow">
        <div class="kpi skeleton"><span>—</span><strong>—</strong></div>
        <div class="kpi skeleton"><span>—</span><strong>—</strong></div>
        <div class="kpi skeleton"><span>—</span><strong>—</strong></div>
        <div class="kpi skeleton"><span>—</span><strong>—</strong></div>
      </div>
      <div class="chart-wrap"><canvas id="chart" aria-label="Portfolio vs SPY chart"></canvas></div>
      <p id="chartNote" class="note"></p>
      <h2 style="margin-top: 1rem;">Run log</h2>
      <div class="table-scroll"><table class="data" id="statsTable" aria-label="Historical stats"><thead></thead><tbody></tbody></table></div>
    </section>

    <footer class="foot">
      <span id="footMeta"></span> · Figures refresh when you click Refresh.
    </footer>
  </div>
  <script src="/dashboard.js"></script>
</body>
</html>
