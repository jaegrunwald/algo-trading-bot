<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trading bench — Watchlist ML</title>
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body data-page="watchlist">
  <div class="shell">
    <header class="top">
      <div class="brand">
        <h1>Watchlist ML</h1>
        <p>Ratings for <code>WATCHLIST_TICKERS</code> via the rating API (may take up to a minute).</p>
      </div>
      <div class="toolbar">
        <button type="button" class="btn" id="btnRefresh" title="Reload">↻ Refresh</button>
        <button type="button" class="btn" id="btnTheme" title="Toggle theme">◐ Theme</button>
      </div>
      <div class="status-row" id="statusPills"></div>
      <p id="pageErr" class="err" style="display: none; width: 100%; flex-basis: 100%; margin-top: 0.5rem;"></p>
    </header>

    <div class="layout">
      <nav class="site-nav" aria-label="Main">
        <a href="/">Home</a>
        <a href="/benchmark">Benchmark</a>
        <a href="/watchlist">Watchlist ML</a>
        <a href="/model">Model</a>
        <a href="/positions">Positions</a>
        <a href="/scheduler">Scheduler</a>
      </nav>

      <main class="content">
        <section class="panel" id="watchlist">
          <h2>Watchlist</h2>
          <p id="watchlistNote" class="note">Loading ratings…</p>
          <div class="table-scroll" id="watchlistScroll" style="display: none;">
            <table class="data" id="watchlistTable" aria-label="Watchlist ratings"><thead></thead><tbody></tbody></table>
          </div>
          <p id="watchlistErr" class="err" style="display: none;"></p>
        </section>

        <footer class="foot">
          <span id="footMeta"></span>
        </footer>
      </main>
    </div>
  </div>
  <script src="/dashboard.js"></script>
</body>
</html>
