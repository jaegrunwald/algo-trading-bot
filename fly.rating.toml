# Flask rating API (root Dockerfile). Deploy as its own Fly app:
#   fly apps create algo-trading-rating   # once; pick a unique global name
#   fly deploy --config fly.rating.toml
#
# Same org + region as the dashboard app so the dashboard can use:
#   RATING_ENGINE_URL=http://<this-app-name>.internal:5000
app = "algo-trading-rating"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 5000
  force_https = true
  # Dashboard calls this over .internal — keep a Machine running so fetches do not hit a stopped service.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "get"
  path = "/health"

[[vm]]
  # sklearn + joblib can spike RAM at cold start; avoid OOM restart loops.
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
